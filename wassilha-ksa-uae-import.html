<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصّلها — استورد من السعودية إلى الإمارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1E29;
    --ink-soft:rgba(26,30,41,.68);
    --sand:#F2F5F6;
    --sand-deep:#E3E9EC;
    --paper:#FFFFFF;
    --copper:#F4A93E;
    --copper-deep:#D98F22;
    --amber-light:#FBC65E;
    --amber-soft:#FBE9C9;
    --teal:#3C5A6B;
    --teal-soft:#DEE6EA;
    --steel:#7C97A6;
    --steel-soft:#E6EBEE;
    --slate:#5C6B76;
    --line:#D6DEE3;
    --danger:#C1543C;
    --font-display:'Cairo',sans-serif;
    --font-body:'IBM Plex Sans Arabic',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:var(--font-display);color:var(--ink);margin:0;}
  a{color:inherit;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  .container{max-width:1080px;margin:0 auto;padding:0 24px;}
  :focus-visible{outline:3px solid var(--copper);outline-offset:2px;}

  /* Header */
  header.site{position:sticky;top:0;z-index:40;background:rgba(242,245,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .header-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:18px;height:18px;}
  .brand-name{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:.2px;}
  nav.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;}
  nav.tabs button{background:transparent;border:none;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--slate);white-space:nowrap;transition:.15s;}
  nav.tabs button.active{background:var(--ink);color:#fff;}
  nav.tabs button:hover:not(.active){background:var(--sand-deep);color:var(--ink);}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0;}
  .lang-toggle button{background:var(--paper);border:none;padding:8px 14px;font-size:13px;font-weight:700;color:var(--slate);}
  .lang-toggle button.active{background:var(--copper);color:#fff;}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:11px;font-weight:700;font-size:15px;border:none;transition:.15s;text-decoration:none;}
  .btn-primary{background:var(--copper);color:#fff;}
  .btn-primary:hover{background:var(--copper-deep);}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  .btn-ghost:hover{background:var(--ink);color:#fff;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* Hero */
  .hero{position:relative;overflow:hidden;padding:0;margin-bottom:8px;}
  .hero-bg{position:absolute;inset:0;z-index:0;}
  .hero-bg svg{width:100%;height:100%;display:block;}
  .hero-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg, rgba(26,30,41,.10) 0%, rgba(26,30,41,.40) 60%, rgba(26,30,41,.72) 100%);}
  .hero-inner{position:relative;z-index:2;padding:88px 0 44px;}
  .hero-inner .eyebrow{color:var(--amber-light);}
  .hero-inner h1{color:#fff;max-width:20ch;}
  .hero-inner p.lead{color:rgba(255,255,255,.86);}
  .hero-inner .btn-ghost{border-color:#fff;color:#fff;}
  .hero-inner .btn-ghost:hover{background:#fff;color:var(--ink);}
  .route-strip{margin-top:46px;background:rgba(26,30,41,.45);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:16px 22px 12px;max-width:640px;}
  .route-strip svg{width:100%;height:auto;display:block;}
  .eyebrow{font-family:var(--font-mono);font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--steel);text-transform:uppercase;margin-bottom:14px;display:block;}
  .hero h1{font-size:42px;line-height:1.22;font-weight:800;margin-bottom:18px;}
  .hero p.lead{font-size:17px;color:var(--ink-soft);max-width:46ch;margin-bottom:28px;}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
  .route-cap{display:flex;justify-content:space-between;margin-top:4px;padding:0 6px;font-family:var(--font-mono);font-size:12px;color:rgba(255,255,255,.7);}

  /* Steps */
  .section{padding:44px 0;}
  .section-title{font-size:26px;font-weight:800;margin-bottom:8px;}
  .section-sub{color:var(--ink-soft);margin-bottom:30px;font-size:15px;}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .step-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .step-num{font-family:var(--font-mono);font-weight:700;font-size:13px;margin-bottom:10px;}
  .step-card:nth-child(1) .step-num{color:var(--copper);}
  .step-card:nth-child(2) .step-num{color:var(--steel);}
  .step-card:nth-child(3) .step-num{color:var(--teal);}
  .step-card:nth-child(4) .step-num{color:var(--copper-deep);}
  .step-card h3{font-size:16px;margin-bottom:6px;}
  .step-card p{font-size:13.5px;color:var(--ink-soft);margin:0;}

  .usp-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px;}
  .usp{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .usp-icon{width:36px;height:36px;border-radius:9px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .usp:nth-child(1) .usp-icon{background:var(--amber-soft);color:var(--copper-deep);}
  .usp:nth-child(2) .usp-icon{background:var(--steel-soft);color:var(--steel);}
  .usp:nth-child(3) .usp-icon{background:var(--teal-soft);color:var(--teal);}
  .usp h3{font-size:15px;margin-bottom:4px;}
  .usp p{font-size:13px;color:var(--ink-soft);margin:0;}

  /* Cards / forms */
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px;}
  .panel-two{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;color:var(--ink);}
  .field{margin-bottom:16px;}
  input[type=text],input[type=tel],input[type=number],input[type=url],select,textarea{
    width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--sand);font-size:14.5px;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{border-color:var(--copper);background:#fff;}
  textarea{resize:vertical;min-height:80px;}
  .hint{font-size:12px;color:var(--slate);margin-top:5px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .result-box{background:var(--sand);border:1.5px dashed var(--line);border-radius:14px;padding:20px;margin-top:6px;}
  .result-line{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line);}
  .result-line:last-of-type{border-bottom:none;}
  .result-line .val{font-family:var(--font-mono);font-weight:600;}
  .result-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:14px;border-top:2px solid var(--ink);}
  .result-total .val{font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--copper-deep);background:var(--amber-soft);padding:2px 10px;border-radius:8px;}
  .placeholder-note{color:var(--slate);font-size:13.5px;}

  .code-chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-weight:700;font-size:20px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;letter-spacing:.5px;}
  .confirm-box{text-align:center;padding:36px 20px;}
  .confirm-box .icon-ok{width:56px;height:56px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .alert{padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:16px;}
  .alert-error{background:#FBEAE5;color:var(--danger);border:1px solid #EFC7BA;}
  .alert-ok{background:var(--teal-soft);color:var(--teal);border:1px solid #BFDBD4;}

  /* Timeline */
  .timeline{display:flex;flex-direction:column;gap:0;margin-top:22px;}
  .tl-item{display:flex;gap:14px;position:relative;padding-bottom:26px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-dot-col{display:flex;flex-direction:column;align-items:center;}
  .tl-dot{width:22px;height:22px;border-radius:50%;background:var(--sand-deep);border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .tl-dot.done{background:var(--teal);border-color:var(--teal);}
  .tl-dot.current{background:var(--copper);border-color:var(--copper);box-shadow:0 0 0 4px rgba(198,121,59,.18);}
  .tl-line{width:2px;flex:1;background:var(--line);margin-top:2px;}
  .tl-line.done{background:var(--steel);}
  .tl-content h3{font-size:15px;margin-bottom:3px;}
  .tl-content p{font-size:12.5px;color:var(--slate);margin:0;}

  /* Orders list */
  .order-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer;transition:.15s;}
  .order-card:hover{border-color:var(--copper);}
  .order-code{font-family:var(--font-mono);font-weight:700;font-size:14px;}
  .order-meta{font-size:12.5px;color:var(--slate);margin-top:3px;}
  .status-pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--teal-soft);color:var(--teal);white-space:nowrap;}
  .status-pill.inprogress{background:var(--amber-soft);color:var(--copper-deep);}
  .empty-state{text-align:center;padding:50px 20px;color:var(--slate);}

  .track-search{display:flex;gap:10px;margin-bottom:8px;}
  .track-search input{flex:1;font-family:var(--font-mono);font-size:15px;letter-spacing:.3px;}

  footer.site{border-top:1px solid var(--line);margin-top:40px;padding:32px 0;}
  .footer-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .footer-note{font-size:12.5px;color:var(--slate);}

  @media (max-width:820px){
    .steps{grid-template-columns:1fr 1fr;}
    .usp-row{grid-template-columns:1fr;}
    .panel-two{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    .hero-inner h1{font-size:32px;}
    .hero-inner{padding:64px 0 32px;}
  }

  /* Multi-item request rows */
  .item-row{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--sand);}
  .item-row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .item-row-title{font-weight:700;font-size:13.5px;color:var(--steel);}
  .item-remove{background:none;border:none;color:var(--danger);font-size:12.5px;font-weight:700;padding:0;}

  /* Shipping speed cards */
  .ship-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ship-card{position:relative;display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--sand);}
  .ship-card input{position:absolute;top:14px;inset-inline-end:14px;}
  .ship-card.active{border-color:var(--copper);background:var(--amber-soft);}
  .ship-title{display:block;font-weight:700;font-size:14.5px;margin-bottom:3px;}
  .ship-note{display:block;font-size:12px;color:var(--slate);}

  /* Insurance checkbox */
  .check-row{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:0;}
  .check-row input{width:17px;height:17px;accent-color:var(--copper);}

  /* Admin */
  .admin-stage-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .stage-btn{border:1.5px solid var(--line);background:var(--paper);color:var(--slate);font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:999px;}
  .stage-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .stage-btn.ghost{border-style:dashed;color:var(--steel);}
  .admin-link{background:none;border:none;color:var(--slate);font-size:12px;text-decoration:underline;padding:0;}

  /* Invoice */
  .invoice-sheet{max-width:100%;}
  .invoice-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
  .invoice-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .invoice-table th{text-align:start;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);border-bottom:2px solid var(--line);padding:8px 6px;}
  .invoice-table td{padding:10px 6px;border-bottom:1px solid var(--line);}
  .invoice-table td.inv-link{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:12px;}

  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .panel{border:none;box-shadow:none;padding:0;}
    .section{padding:0;}
  }

  /* Image upload */
  .img-upload-row{display:flex;align-items:center;gap:12px;margin-top:4px;}
  .img-upload-btn{border:1.5px dashed var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .img-upload-btn input{display:none;}
  .img-preview{display:flex;align-items:center;gap:8px;}
  .img-preview img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
  .img-preview button{background:none;border:none;color:var(--danger);font-size:12px;font-weight:700;padding:0;}

  /* Floating WhatsApp */
  .wa-float{position:fixed;bottom:22px;inset-inline-end:22px;z-index:50;display:flex;align-items:center;gap:9px;background:#25D366;color:#fff;padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.18);}
  .wa-float svg{width:20px;height:20px;flex-shrink:0;}

  /* Cancelled banner */
  .cancelled-banner{text-align:center;padding:30px 20px;background:#FBEAE5;border:1px solid #EFC7BA;border-radius:14px;}
  .cancelled-banner h3{color:var(--danger);margin-bottom:6px;}
  .cancelled-banner p{color:var(--ink-soft);margin:0;font-size:13.5px;}

  /* Admin stats + chart */
  .admin-stats-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
  .admin-stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .admin-stat .num{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--copper-deep);}
  .admin-stat .lbl{font-size:12.5px;color:var(--slate);margin-top:4px;}
  .admin-chart{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:20px;}
  .admin-chart svg{width:100%;height:auto;display:block;}
</style>
</head>

function t(k){ return T[state.lang][k]; }
function setView(v){ state.view=v; state.trackResult=null; state.trackError=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function setLang(l){
  if(state.lang===l) return;
  state.lang=l;
  document.documentElement.lang = l;
  document.documentElement.dir = l==='ar' ? 'rtl' : 'ltr';
  render();
}
function fmt(n){ return n.toLocaleString(state.lang==='ar'?'ar-AE':'en-AE',{maximumFractionDigits:2,minimumFractionDigits:2}); }

function computeCost(items, shipping, insured){
  const itemsTotalAED = items.reduce((s,it)=> s + (it.price||0)*0.98, 0);
  const totalWeight = items.reduce((s,it)=> s + (it.weight||1), 0);
  const shippingBase = Math.max(25, totalWeight * 18);
  const shippingFee = shipping === 'express' ? shippingBase * 1.6 : shippingBase;
  const service = Math.max(15, itemsTotalAED * 0.08);
  const insurance = insured ? Math.max(10, itemsTotalAED * 0.03) : 0;
  const customs = itemsTotalAED > 300 ? itemsTotalAED * 0.05 : 0;
  const total = itemsTotalAED + shippingFee + service + insurance + customs;
  return {itemsTotalAED, shippingFee, service, insurance, customs, total};
}

function genCode(){
  const n = Math.floor(100000 + Math.random()*900000);
  return 'WSL-' + n;
}

function stageIndexForOrder(order){
  if(order.statusOverride && STAGE_KEYS.includes(order.statusOverride)){
    return STAGE_KEYS.indexOf(order.statusOverride);
  }
  const duration = TRANSIT_MS[order.shipping] || TRANSIT_MS.standard;
  const elapsed = Date.now() - order.createdAt;
  const frac = Math.min(1, Math.max(0, elapsed / duration));
  let idx = 0;
  for(let i=0;i<STAGE_THRESHOLDS.length;i++){
    if(frac >= STAGE_THRESHOLDS[i]) idx = i;
  }
  if(frac >= 0.98) idx = STAGE_KEYS.length - 1;
  return idx;
}

async function getAuthoritativeOrder(code){
  try{
    const r = await window.storage.get('admin_order:'+code, true);
    return JSON.parse(r.value);
  }catch(e){
    const r2 = await window.storage.get('order:'+code, false);
    return JSON.parse(r2.value);
  }
}

function renderCalcResults(){
  const box = document.getElementById('calcResults');
  if(!box) return;
  const price = parseFloat(document.getElementById('calcPrice').value);
  const weight = parseFloat(document.getElementById('calcWeight').value);
  if(!price || price<=0 || !weight || weight<=0){
    box.innerHTML = `<p class="placeholder-note">${t('res_empty')}</p>`;
    return;
  }
  const c = computeCost([{price, weight}], 'standard', false);
  box.innerHTML = `
    <div class="result-line"><span>${t('res_item')}</span><span class="val">AED ${fmt(c.itemsTotalAED)}</span></div>
    <div class="result-line"><span>${t('res_shipping')}</span><span class="val">AED ${fmt(c.shippingFee)}</span></div>
    <div class="result-line"><span>${t('res_service')}</span><span class="val">AED ${fmt(c.service)}</span></div>
    <div class="result-line"><span>${t('res_customs')}</span><span class="val">AED ${fmt(c.customs)}</span></div>
    <div class="result-total"><span>${t('res_total')}</span><span class="val">AED ${fmt(c.total)}</span></div>
  `;
}

function fileToCompressedDataURL(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function submitOrder(ev){
  ev.preventDefault();
  const d = captureReqDraft();
  const alertBox = document.getElementById('reqAlert');
  const name = d.name.trim();
  const phone = d.phone.trim();
  const items = d.items.map(it=>({
    link: (it.link||'').trim(), price: parseFloat(it.price)||0, weight: parseFloat(it.weight)||1,
    category: it.category, image: it.image || null
  }));
  const validItems = items.filter(it=>(it.link || it.image) && it.price>0);

  if(!name || !phone || validItems.length===0){
    alertBox.innerHTML = `<div class="alert alert-error">${t('err_required')}</div>`;
    return;
  }
  const cost = computeCost(validItems, d.shipping, d.insured);
  const isEdit = !!state.editingCode;
  const code = isEdit ? state.editingCode : genCode();
  const createdAt = isEdit ? state.editingCreatedAt : Date.now();
  const order = {
    code, name, phone, city: d.city, notes: d.notes.trim(),
    shipping: d.shipping, insured: d.insured, items: validItems,
    createdAt, cost, statusOverride: isEdit ? (state.editingStatusOverride || null) : null,
    cancelled: false
  };

  try{
    const res1 = await window.storage.set('order:'+code, JSON.stringify(order), false);
    const res2 = await window.storage.set('admin_order:'+code, JSON.stringify(order), true);
    if(!res1 || !res2){ throw new Error('save failed'); }
    state.confirmedOrder = order;
    state.reqDraft = null;
    state.editingCode = null;
    state.editingCreatedAt = null;
    state.editingStatusOverride = null;
    state.view = isEdit ? 'track' : 'confirm';
    if(isEdit){ state.trackPrefill = code; }
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    alertBox.innerHTML = `<div class="alert alert-error">${t('err_storage')}</div>`;
  }
}

function isEditableOrder(order){
  return !order.cancelled && (Date.now() - order.createdAt) < 60*60*1000;
}

async function startEditOrder(code){
  try{
    const o = await getAuthoritativeOrder(code);
    if(!isEditableOrder(o)) return;
    state.editingCode = o.code;
    state.editingCreatedAt = o.createdAt;
    state.editingStatusOverride = o.statusOverride;
    state.reqDraft = {
      name: o.name, phone: o.phone, city: o.city, notes: o.notes || '',
      shipping: o.shipping, insured: o.insured,
      items: o.items.map(it=>({...it}))
    };
    setView('request');
  }catch(e){}
}

async function cancelOrder(code){
  if(!window.confirm(t('cancel_confirm'))) return;
  try{
    const o = await getAuthoritativeOrder(code);
    if(!isEditableOrder(o)) return;
    o.cancelled = true;
    await window.storage.set('order:'+code, JSON.stringify(o), false);
    await window.storage.set('admin_order:'+code, JSON.stringify(o), true);
    prefillTrackAndGo(code);
  }catch(e){}
}

function renderTrackTimeline(order){
  if(order.cancelled){
    return `
    <div class="panel" style="margin-top:20px">
      <div class="code-chip" style="margin-bottom:18px">${order.code}</div>

        <p>${t('cancelled_note')}</p>
      </div>
    </div>`;
  }

  const stageIdx = stageIndexForOrder(order);
  const items = STAGE_KEYS.map((key, i)=>{
    const done = i < stageIdx || (i===stageIdx && key==='delivered');
    const current = i === stageIdx && key !== 'delivered';
    const dotClass = done ? 'done' : (current ? 'current' : '');
    const lineClass = i < stageIdx ? 'done' : '';
    return `
      <div class="tl-item">
        <div class="tl-dot-col">
          <div class="tl-dot ${dotClass}">${done?ICON_OK:''}</div>
          ${i < STAGE_KEYS.length-1 ? `<div class="tl-line ${lineClass}"></div>` : ''}
        </div>
        <div class="tl-content">
          <h3>${t('stage_'+key+'_t')}</h3>
          <p>${t('stage_'+key+'_d')}</p>
        </div>
      </div>`;
  }).join('');

  const editable = isEditableOrder(order);

  return `
    <div class="panel" style="margin-top:20px">
      <div class="code-chip" style="margin-bottom:18px">${order.code}</div>
      <div class="result-box" style="text-align:${state.lang==='ar'?'right':'left'}">
        <div class="result-line"><span>${t('field_items')}</span><span class="val">${order.items.length}</span></div>
        <div class="result-line"><span>${t('field_shipping')}</span><span class="val">${order.shipping==='express'?t('ship_express'):t('ship_standard')}</span></div>
        <div class="result-line"><span>${t('field_insurance')}</span><span class="val">${order.insured?t('insurance_yes'):t('insurance_no')}</span></div>
        <div class="result-line"><span>${t('field_city')}</span><span class="val">${t('city_'+order.city)}</span></div>
        <div class="result-total"><span>${t('field_est')}</span><span class="val">AED ${fmt(order.cost.total)}</span></div>
      </div>
      <div class="timeline">${items}</div>
      <button class="btn btn-ghost btn-block" style="margin-top:20px" onclick="openInvoice('${order.code}')">${t('invoice_btn')}</button>
      ${editable ? `
        <div class="hero-actions" style="margin-top:12px">
          <button class="btn btn-ghost" style="flex:1" onclick="startEditOrder('${order.code}')">${t('edit_order_btn')}</button>
          <button class="btn btn-ghost" style="flex:1;border-color:var(--danger);color:var(--danger)" onclick="cancelOrder('${order.code}')">${t('cancel_order_btn')}</button>
        </div>
        <p class="hint" style="text-align:center;margin-top:10px">${t('edit_window_note')}</p>

async function loadOrders(){
  const box = document.getElementById('ordersList');
  if(!box) return;
  try{
    const listRes = await window.storage.list('order:', false);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    if(keys.length === 0){ throw new Error('empty'); }
    const orders = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, false);
        const local = JSON.parse(r.value);
        let authoritative = local;
        try{ authoritative = await getAuthoritativeOrder(local.code); }catch(e){ /* fall back to local */ }
        orders.push(authoritative);
      }catch(e){ /* skip unreadable entry */ }
    }
    orders.sort((a,b)=>b.createdAt-a.createdAt);
    if(orders.length===0){ throw new Error('empty'); }
    box.innerHTML = orders.map(o=>{
      const idx = stageIndexForOrder(o);
      const delivered = idx === STAGE_KEYS.length-1;
      return `
      <div class="order-card" onclick="prefillTrackAndGo('${o.code}')">
        <div>
          <div class="order-code">${o.code}</div>
          <div class="order-meta">${t('city_'+o.city)} · AED ${fmt(o.cost.total)}</div>
        </div>
        <div class="status-pill ${delivered?'':'inprogress'}">${delivered ? t('status_delivered') : t('status_inprogress')}</div>
      </div>`;
    }).join('');
  }catch(err){
    box.innerHTML = `
      <div class="empty-state">
        <p style="font-weight:700;color:var(--ink);margin-bottom:4px">${t('orders_empty_t')}</p>
        <p style="margin-bottom:18px">${t('orders_empty_d')}</p>
        <button class="btn btn-primary" onclick="setView('request')">${t('orders_empty_cta')}</button>
      </div>`;
  }
}

          <div class="result-total"><span>${t('res_total')}</span><span class="val">AED ${fmt(o.cost.total)}</span></div>
        </div>

        <p class="hint" style="text-align:center;margin-top:22px">${t('invoice_thanks')}</p>

        <div class="hero-actions no-print" style="justify-content:center;margin-top:20px">
          <button class="btn btn-primary" onclick="window.print()">${t('invoice_print')}</button>
          <button class="btn btn-ghost" onclick="prefillTrackAndGo('${o.code}')">${t('invoice_back')}</button>
        </div>
      </div>`;
  }catch(err){
    box.innerHTML = `<div class="alert alert-error">${t('track_notfound')}</div>`;
  }
}

/* ---------- Admin ---------- */
function viewAdmin(){
  if(!state.adminAuthed){
    return `
    <section class="section">
      <div class="container" style="max-width:420px">
        <h2 class="section-title">${t('admin_title')}</h2>
        <p class="section-sub">${t('admin_sub')}</p>
        <div class="panel">
          <div id="adminAlert"></div>
          <div class="field"><label>${t('admin_pin_label')}</label><input type="text" id="adminPin" inputmode="numeric"></div>
          <button class="btn btn-primary btn-block" onclick="adminLogin()">${t('admin_pin_btn')}</button>
        </div>
      </div>
    </section>`;
  }
  return `
  <section class="section">
    <div class="container" style="max-width:820px">
      <h2 class="section-title">${t('admin_title')}</h2>
      <p class="section-sub">${t('admin_sub')}</p>
      <div id="adminList"><p class="placeholder-note">...</p></div>
    </div>
  </section>`;
}

function adminLogin(){
  const val = document.getElementById('adminPin').value.trim();
  const alertBox = document.getElementById('adminAlert');
  if(val === ADMIN_PIN){
    state.adminAuthed = true;
    render();
  }else{
    alertBox.innerHTML = `<div class="alert alert-error">${t('admin_pin_wrong')}</div>`;
  }
}

function renderAdminChart(orders){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now() - i*24*60*60*1000);
    days.push({key: d.toDateString(), label: d.toLocaleDateString(state.lang==='ar'?'ar-AE':'en-AE',{weekday:'short'}), count:0});
  }
  orders.forEach(o=>{
    const key = new Date(o.createdAt).toDateString();
    const day = days.find(d=>d.key===key);
    if(day) day.count++;
  });
  const max = Math.max(1, ...days.map(d=>d.count));
  const barW = 64, gap = 18, chartH = 120, baseY = 140;
  const totalW = days.length * (barW+gap);
  const bars = days.map((d,i)=>{
    const h = Math.round((d.count/max) * chartH);
    const x = i*(barW+gap) + gap/2;
    const y = baseY - h;
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="6" fill="#F4A93E"/>
      <text x="${x+barW/2}" y="${baseY+18}" text-anchor="middle" font-size="11" fill="#5C6B76" font-family="IBM Plex Sans Arabic">${d.label}</text>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1E29" font-family="JetBrains Mono">${d.count}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${totalW} 165" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
}

async function loadAdminOrders(){
  const box = document.getElementById('adminList');
  if(!box) return;
  try{
    const listRes = await window.storage.list('admin_order:', true);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    if(keys.length===0){ throw new Error('empty'); }
    const orders = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        orders.push(JSON.parse(r.value));
      }catch(e){}
    }
    orders.sort((a,b)=>b.createdAt-a.createdAt);
    if(orders.length===0){ throw new Error('empty'); }

    const revenue = orders.filter(o=>!o.cancelled).reduce((s,o)=>s+o.cost.total,0);
    const statsHTML = `
      <div class="admin-stats-row">
        <div class="admin-stat"><div class="num">${orders.length}</div><div class="lbl">${t('admin_stats_orders')}</div></div>
        <div class="admin-stat"><div class="num">AED ${fmt(revenue)}</div><div class="lbl">${t('admin_stats_revenue')}</div></div>
      </div>
      <div class="admin-chart">
        <p style="font-weight:700;font-size:13.5px;margin:0 0 10px">${t('admin_chart_title')}</p>
        ${renderAdminChart(orders)}
      </div>`;

    const listHTML = orders.map(o=>{
      const autoIdx = (()=>{ const clone=Object.assign({},o,{statusOverride:null}); return stageIndexForOrder(clone); })();
      const currentIdx = stageIndexForOrder(o);
      return `
      <div class="panel" style="margin-bottom:14px;padding:18px 20px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <div class="code-chip" style="font-size:14px;padding:6px 12px">${o.code}</div>
          <span class="order-meta">${o.name} · ${o.phone} · ${t('city_'+o.city)} · AED ${fmt(o.cost.total)}${o.cancelled ? ' · '+t('cancelled_title') : ''}</span>
        </div>
        <p class="hint" style="margin-top:10px">${t('admin_set_status')} ${!o.statusOverride ? '· <em>'+t('admin_auto')+'</em>' : ''}</p>
        <div class="admin-stage-row">
          ${STAGE_KEYS.map((key,i)=>`
            <button class="stage-btn ${i===currentIdx?'active':''}" onclick="setOrderStatus('${o.code}','${key}')">${t('stage_'+key+'_t')}</button>
          `).join('')}
          <button class="stage-btn ghost" onclick="clearOrderStatus('${o.code}')">${t('admin_auto')}</button>
        </div>
      </div>`;
    }).join('');

    box.innerHTML = statsHTML + listHTML;
  }catch(err){
    box.innerHTML = `<p class="placeholder-note">${t('admin_empty')}</p>`;
  }
}

async function setOrderStatus(code, key){
  try{
    const o = await getAuthoritativeOrder(code);
    o.statusOverride = key;
    await window.storage.set('admin_order:'+code, JSON.stringify(o), true);
    loadAdminOrders();
  }catch(e){}
}
async function clearOrderStatus(code){
  try{
    const o = await getAuthoritativeOrder(code);
    o.statusOverride = null;
    await window.storage.set('admin_order:'+code, JSON.stringify(o), true);
    loadAdminOrders();
  }catch(e){}
}

/* ---------- Shell ---------- */
function headerHTML(){
  const tabs = [['home','nav_home'],['calc','nav_calc'],['request','nav_request'],['track','nav_track'],['orders','nav_orders']];
  return `
  <header class="site no-print">
    <div class="container header-row">
      <div class="brand">
        <div class="brand-mark">${ICON_MARK}</div>
        <span class="brand-name">${t('brand')}</span>
      </div>
      <nav class="tabs">
        ${tabs.map(([id,key])=>`<button class="${state.view===id?'active':''}" onclick="setView('${id}')">${t(key)}</button>`).join('')}
      </nav>
      <div class="lang-toggle">
        <button class="${state.lang==='ar'?'active':''}" onclick="setLang('ar')">AR</button>
        <button class="${state.lang==='en'?'active':''}" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </header>`;
}
function footerHTML(){
  return `
  <footer class="site no-print">
    <div class="container footer-row">
      <span class="brand-name" style="font-size:15px">${t('brand')}</span>
      <span class="footer-note">${t('footer_note')}</span>
      <button class="admin-link" onclick="setView('admin')">${t('admin_link')}</button>
    </div>
  </footer>`;
}

function waFloatHTML(){
  return `<a class="wa-float no-print" href="https://wa.me/971500000000" target="_blank" rel="noopener">${ICON_CHAT}<span>${t('wa_button')}</span></a>`;
}

function render(){
  let body = '';
  if(state.view==='home') body = viewHome();
  else if(state.view==='calc') body = viewCalc();
  else if(state.view==='request') body = viewRequest();
  else if(state.view==='confirm') body = viewConfirm();
  else if(state.view==='track') body = viewTrack();
  else if(state.view==='orders') body = viewOrders();
  else if(state.view==='invoice') body = viewInvoice();
  else if(state.view==='admin') body = viewAdmin();

  document.getElementById('root').innerHTML = headerHTML() + body + footerHTML() + waFloatHTML();

  if(state.view==='orders'){ loadOrders(); }
  if(state.view==='invoice'){ loadInvoice(); }
  if(state.view==='admin' && state.adminAuthed){ loadAdminOrders(); }
  if(state.view==='track' && state.trackPrefill){
    const el = document.getElementById('trackInput');
    if(el){ el.value = state.trackPrefill; runTrack(); }
    state.trackPrefill = null;
  }
}

document.documentElement.lang = state.lang;
document.documentElement.dir = 'rtl';
render();
</script>
